name: Create Release from setup.py

on:
  pull_request:
    types:
      - closed
    branches:
      - master

# One release at a time; a second merge waits instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}

    steps:
      # Check out the tip of master, not the PR merge ref, so that the
      # CHANGELOG commit below is always a fast-forward of master.
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Upgrade pip, setuptools, packaging and install git-cliff
        run: |
          python -m pip install --upgrade pip setuptools packaging
          pip install git-cliff

      - name: Extract version from setup.py
        id: get_version
        run: |
          VERSION=$(python setup.py --version)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Get latest release tag
        id: get_last_release
        run: |
          latest=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | jq -r '.tag_name // "v0.0.0"' | sed 's/^v//')
          echo "LATEST_RELEASE=$latest" >> $GITHUB_ENV

      - name: Check release version
        run: |
          echo "New version: ${{ steps.get_version.outputs.VERSION }}"
          echo "Latest release: $LATEST_RELEASE"
          python - <<EOF
          from packaging.version import parse

          new_version = parse("${{ steps.get_version.outputs.VERSION }}")
          latest_version = parse("$LATEST_RELEASE")

          if new_version <= latest_version:
              raise SystemExit(f"Error: New version ({new_version}) is not higher than latest release ({latest_version})")
          EOF

      # The steps below are idempotent so the job can be safely re-run after a
      # transient failure (e.g. a GitHub storage error while pushing the tag).
      - name: Generate release notes and update CHANGELOG.md
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          if grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG.md already has $VERSION; reusing it for the release notes."
            awk -v v="## [$VERSION]" 'index($0, v)==1 {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > RELEASE_NOTES.md
          else
            git-cliff --unreleased --strip all --tag "v$VERSION" > RELEASE_NOTES.md
            git-cliff --unreleased --tag "v$VERSION" --prepend CHANGELOG.md
          fi

      # master must accept direct pushes from github-actions (no branch protection).
      - name: Commit and push CHANGELOG.md
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md unchanged; nothing to commit."
          else
            git commit -m "chore: update CHANGELOG.md for v${{ steps.get_version.outputs.VERSION }}"
            git push origin HEAD:master
          fi

      - name: Create Git tag
        run: |
          TAG="v${{ steps.get_version.outputs.VERSION }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on the remote; skipping."
          else
            git tag -f "$TAG"
            for i in 1 2 3 4 5; do
              git push origin "$TAG" && exit 0
              echo "Push of $TAG failed (attempt $i); retrying in 20s..."
              sleep 20
            done
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-dev:
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      # Fast-forwards dev to master when dev has not moved since the release PR
      # (dev == master); otherwise creates one merge commit (dev 1 ahead).
      # dev must accept direct pushes from github-actions (no branch protection).
      # A merge conflict fails the job on purpose: it needs a human.
      - name: Sync master into dev
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          for i in 1 2 3; do
            git fetch origin master dev
            if git merge-base --is-ancestor origin/master origin/dev; then
              echo "dev already contains master; nothing to sync."
              exit 0
            fi
            git checkout -B dev origin/dev
            git merge origin/master --no-edit
            git push origin dev && exit 0
            echo "Push to dev rejected (attempt $i, dev moved); retrying..."
            sleep 5
          done
          exit 1
